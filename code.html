<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Life &mdash; Source</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; background: #101827; color: #e8eef9; }
    header { padding: 1.5rem 1.5rem 0; text-align: center; }
    h1 { margin: 0; font-size: 1.55rem; }
    p { color: #adbad0; }
    nav.top-nav { text-align: center; margin: .75rem 0 0; }
    nav.top-nav a { color: #62d9a4; text-decoration: none; font-weight: 600; }
    nav.top-nav a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    #tabs { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1rem; }
    #tabs button { padding: .5rem .9rem; border: 0; border-radius: 6px; background: #182338; color: #adbad0; font: inherit; cursor: pointer; }
    #tabs button:hover { background: #1d2a3e; }
    #tabs button.active { background: #3182ce; color: white; }
    .file-path { font-family: ui-monospace, monospace; color: #6c7f9c; font-size: .85rem; margin: 0 0 .5rem; }
    pre { margin: 0; border-radius: 8px; overflow-x: auto; max-width: 100%; }
    pre code.hljs { padding: 1rem; display: block; font-size: .85rem; line-height: 1.5; }
    #status { text-align: center; color: #6c7f9c; }
  </style>
</head>
<body>
  <header>
    <h1>Game of Life &mdash; Source</h1>
    <p>The Python model behind the simulation, read directly from the repository.</p>
    <nav class="top-nav"><a href="index.html">&larr; Back to simulation</a></nav>
  </header>
  <main>
    <div id="tabs"></div>
    <p class="file-path" id="file-path"></p>
    <pre><code id="code-view" class="language-python"></code></pre>
    <p id="status"></p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script>
    // These paths are fetched as plain static text, so this page needs no
    // server or build step of its own — it works the same on GitHub Pages
    // as it does opened straight off disk (modulo local file:// CORS rules).
    const files = [
      { label: '__init__.py', path: 'src/simulation/__init__.py' },
      { label: 'life.py', path: 'src/simulation/life.py' },
      { label: 'state.py', path: 'src/simulation/state.py' },
    ];
    const tabs = document.querySelector('#tabs');
    const codeView = document.querySelector('#code-view');
    const filePath = document.querySelector('#file-path');
    const status = document.querySelector('#status');
    const cache = new Map();

    async function showFile(file, button) {
      [...tabs.children].forEach(b => b.classList.remove('active'));
      button.classList.add('active');
      filePath.textContent = file.path;
      status.textContent = '';
      try {
        if (!cache.has(file.path)) {
          const response = await fetch(file.path);
          if (!response.ok) throw new Error(`${file.path} failed: ${response.status}`);
          cache.set(file.path, await response.text());
        }
        codeView.textContent = cache.get(file.path);
        delete codeView.dataset.highlighted;
        hljs.highlightElement(codeView);
      } catch (err) {
        codeView.textContent = '';
        status.textContent = `Could not load ${file.path}. Try opening this site over http(s) rather than as a local file.`;
      }
    }

    files.forEach((file, i) => {
      const button = document.createElement('button');
      button.textContent = file.label;
      button.onclick = () => showFile(file, button);
      tabs.appendChild(button);
      if (i === 0) showFile(file, button);
    });
  </script>
</body>
</html>
